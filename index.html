<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحسن - مربوط سحابي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma;background:#f3f6f8;margin:0;padding:10px}
.container{max-width:900px;margin:auto;background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 15px #0001}
h1{text-align:center;color:#0a7a3d;margin:5px}
input,button{padding:10px;margin:4px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#0a7a3d;color:#fff;cursor:pointer;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #ddd;padding:7px;text-align:center}
th{background:#0a7a3d;color:#fff}
.status{padding:10px;background:#e8f5e9;border-radius:8px;text-align:center;margin:10px 0;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>نظام الحسن للفواتير - سحابي ✅</h1>
<div id="syncStatus" class="status">جاري الربط بـ Supabase...</div>
<div style="display:flex;flex-wrap:wrap">
<input id="clientName" placeholder="اسم العميل" style="flex:2">
<input id="clientPhone" placeholder="التليفون" style="flex:1">
<input type="date" id="invoiceDate" style="flex:1">
</div>
<table><thead><tr><th>البيان</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>حذف</th></tr></thead><tbody id="itemsBody"></tbody></table>
<button onclick="addItem()" style="background:#555">+ إضافة صنف</button>
<h3 style="text-align:left">الإجمالي: <span id="totalAmount">0</span> جنيه</h3>
<button onclick="saveInvoice()" style="width:100%;padding:14px;font-size:19px">💾 حفظ ومزامنة سحابية</button>
<h3>الفواتير المحفوظة (من السحابة)</h3>
<div id="invoicesList"></div>
</div>
<script>
const SUPABASE_URL = 'https://drvajujxpcxkggvmsrdj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NpOswKNeXlNGlMImEHAK3g_zfiAqnqr';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let invoices=[],currentItems=[];
function addItem(n='',q=1,p=0){currentItems.push({name:n,qty:q,price:p});renderItems()}
function renderItems(){
let tbody=document.getElementById('itemsBody');tbody.innerHTML='';let total=0;
currentItems.forEach((it,i)=>{let line=it.qty*it.price;total+=line;
tbody.innerHTML+=`<tr><td><input value="${it.name}" onchange="currentItems[${i}].name=this.value" style="width:90%"></td><td><input type="number" value="${it.qty}" onchange="currentItems[${i}].qty=parseFloat(this.value)||0;renderItems()" style="width:60px"></td><td><input type="number" value="${it.price}" onchange="currentItems[${i}].price=parseFloat(this.value)||0;renderItems()" style="width:80px"></td><td>${line}</td><td><button onclick="currentItems.splice(${i},1);renderItems()" style="background:red">X</button></td></tr>`});
document.getElementById('totalAmount').textContent=total;
}
async function loadCloud(){
try{
const {data,error}=await supabaseClient.from('alhassan_data').select('data').eq('id',1).single();
if(error)throw error;
if(data?.data?.invoices){invoices=data.data.invoices;renderInvoices()}
document.getElementById('syncStatus').innerHTML='✅ مربوط سحابياً - شغال 100%';
}catch(e){document.getElementById('syncStatus').innerHTML='⚠️ اعمل الجدول في سوبابيز - SQL Editor: '+e.message}
}
async function saveCloud(){
let payload={invoices:invoices,lastUpdate:new Date().toISOString()};
try{
let {error}=await supabaseClient.from('alhassan_data').update({data:payload}).eq('id',1);
if(error)throw error;
document.getElementById('syncStatus').innerHTML='✅ تمت المزامنة السحابية الآن';
}catch(e){document.getElementById('syncStatus').innerHTML='❌ خطأ: '+e.message}
}
async function saveInvoice(){
let name=document.getElementById('clientName').value||'عميل';
let phone=document.getElementById('clientPhone').value||'';
let date=document.getElementById('invoiceDate').value||new Date().toISOString().split('T')[0];
if(currentItems.length==0){alert('ضيف صنف');return}
let total=currentItems.reduce((s,it)=>s+it.qty*it.price,0);
invoices.unshift({id:Date.now(),name,phone,date,items:[...currentItems],total});
await saveCloud();renderInvoices();currentItems=[];renderItems();alert('تم الحفظ سحابياً!');
}
function renderInvoices(){
let div=document.getElementById('invoicesList');
if(invoices.length==0){div.innerHTML='لا يوجد';return}
div.innerHTML=invoices.map(inv=>`<div style="border:1px solid #ddd;padding:8px;margin:5px 0;border-radius:8px"><b>${inv.name}</b> - ${inv.phone} - ${inv.date} - <b>${inv.total} ج</b> <button onclick="invoices=invoices.filter(x=>x.id!=${inv.id});saveCloud();renderInvoices()" style="background:red;float:left">حذف</button><div style="font-size:12px">${inv.items.map(it=>it.name+' ('+it.qty+'*'+it.price+')').join(' - ')}</div></div>`).join('');
}
addItem();document.getElementById('invoiceDate').valueAsDate=new Date();loadCloud();
</script>
</body>
</html>
